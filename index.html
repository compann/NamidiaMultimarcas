<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Na Mídia Multimarcas — Loja</title>
<meta name="description" content="Loja Na Mídia Multimarcas. Escolha seus produtos, monte sua sacola e finalize o pedido pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<header>
  <div class="wrap header-row">
    <a class="brand" href="#topo" aria-label="Na Mídia Multimarcas — início">
      <img src="images/logo-preto.png" alt="Na Mídia Multimarcas">
    </a>

    <div class="searchbar">
      <form onsubmit="return false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-6-6"/></svg>
        <input type="search" class="js-search" placeholder="Buscar produtos..." aria-label="Buscar produtos">
      </form>
    </div>

    <div class="header-right">
      <a class="icon-btn" id="header-wa" href="#" target="_blank" rel="noopener" aria-label="Atendimento no WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg>
      </a>
      <button class="icon-btn" id="btn-favs" aria-label="Favoritos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 1 1 7.5-6.6 5 5 0 1 1 7.5 6.6"/></svg>
        <span class="count-badge" id="fav-count">0</span>
      </button>
      <button class="icon-btn" id="btn-cart" aria-label="Sacola">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17h-11v-14h-2"/><path d="M6 5l14 1l-1 7h-13"/></svg>
        <span class="count-badge" id="cart-count">0</span>
      </button>
    </div>
  </div>

  <div class="search-mobile">
    <form onsubmit="return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-6-6"/></svg>
      <input type="search" class="js-search" placeholder="Buscar produtos..." aria-label="Buscar produtos">
    </form>
  </div>

  <nav class="mainnav">
    <div class="wrap">
      <a href="#topo" data-nav="inicio">Início</a>
      <a href="#catalogo" data-nav="produtos">Produtos</a>
      <div class="nav-dropdown" id="nav-dropdown">
        <button id="nav-cat-btn" aria-haspopup="true" aria-expanded="false">
          Categorias
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="nav-menu" id="nav-menu"></div>
      </div>
    </div>
  </nav>
</header>

<main id="topo">
  <section class="catalog wrap" id="catalogo">
    <h1 class="catalog-title">Produtos</h1>

    <div class="tabs" id="tabs"></div>

    <div class="catalog-body">
      <aside class="filters" id="filters-desktop"></aside>

      <div class="catalog-main">
        <div class="toolbar">
          <span class="count" id="count">—</span>
          <div class="toolbar-actions">
            <button class="btn-filter-mobile" id="btn-filter-mobile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
              Filtrar
            </button>
            <select class="sort-select" id="sort" aria-label="Ordenar">
              <option value="recentes">Mais recentes</option>
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
              <option value="az">Nome (A–Z)</option>
            </select>
          </div>
        </div>

        <div class="grid" id="grid"></div>
        <button class="load-more" id="load-more" hidden>Carregar mais produtos</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="footer-cols">
      <div class="foot-about">
        <img src="images/logo-preto.png" alt="Na Mídia Multimarcas">
        <p id="foot-pitch"></p>
        <div class="foot-addr" id="foot-addr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0"/></svg>
          <span id="foot-addr-text"></span>
        </div>
      </div>

      <div class="foot-links">
        <h4>Links</h4>
        <nav>
          <a href="#topo">Início</a>
          <a href="#catalogo">Produtos</a>
        </nav>
      </div>

      <div class="foot-social">
        <h4>Redes sociais</h4>
        <a id="footer-ig" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3"/><path d="M16.5 7.5v.01"/></svg>
        </a>
      </div>

      <div class="foot-payment">
        <h4>Compra segura</h4>
        <div class="foot-seal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5 -3 7.5 -7 9c-4 -1.5 -7 -4.5 -7 -9v-6z"/><path d="M9 12l2 2l4 -4"/></svg>
          <span><b>100% protegido</b>Seus dados e seu pedido, seguros.</span>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      © <span id="ano"></span> Na Mídia Multimarcas · Todos os direitos reservados
    </div>
  </div>
</footer>

<a class="float-wa" id="float-wa" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.07zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
</a>

<div class="overlay" id="overlay"></div>

<!-- SACOLA -->
<aside class="drawer" id="drawer-cart" aria-label="Sua sacola">
  <div class="drawer-head">
    <h2>Sua sacola</h2>
    <button class="drawer-close" data-close-drawer aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body" id="cart-body"></div>
  <div class="drawer-foot" id="cart-foot">
    <div class="cart-total"><span>Total</span><b id="cart-total-val">R$ 0,00</b></div>
    <div class="field">
      <label>Seu nome <span class="req">*</span></label>
      <input type="text" id="cart-nome" autocomplete="name" placeholder="Como podemos te chamar?">
    </div>
    <div class="field">
      <label>Observação (opcional)</label>
      <textarea id="cart-obs" placeholder="Cor preferida, ponto de referência da entrega, etc."></textarea>
    </div>
    <p class="form-err" id="cart-err"></p>
    <button class="btn-primary wa" id="cart-checkout">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.07z"/></svg>
      Finalizar pedido no WhatsApp
    </button>
  </div>
</aside>

<!-- FAVORITOS -->
<aside class="drawer" id="drawer-favs" aria-label="Favoritos">
  <div class="drawer-head">
    <h2>Favoritos</h2>
    <button class="drawer-close" data-close-drawer aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body" id="favs-body"></div>
</aside>

<!-- FILTROS (mobile) -->
<aside class="drawer" id="drawer-filters" aria-label="Filtros">
  <div class="drawer-head">
    <h2>Filtrar</h2>
    <button class="drawer-close" data-close-drawer aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body"><div id="filters-mobile"></div></div>
  <div class="drawer-foot">
    <button class="btn-primary" data-close-drawer>Ver resultados</button>
  </div>
</aside>

<!-- FOLHA: adicionar à sacola -->
<div class="sheet-wrap" id="sheet-wrap">
  <div class="sheet">
    <button class="x" id="s-close" aria-label="Fechar">✕</button>
    <span class="s-cat" id="s-cat"></span>
    <div class="s-name" id="s-name"></div>
    <div class="s-price" id="s-price"></div>
    <div id="s-size-block">
      <div class="s-label">Tamanho <span class="req">*</span></div>
      <div class="size-row" id="s-sizes"></div>
    </div>
    <div class="sheet-qty-row">
      <div class="s-label">Quantidade</div>
      <div class="qty">
        <button id="s-qminus" aria-label="Diminuir">−</button>
        <span id="s-qty">1</span>
        <button id="s-qplus" aria-label="Aumentar">+</button>
      </div>
    </div>
    <p class="form-err" id="s-err">Escolha um tamanho para continuar.</p>
    <button class="btn-primary" id="s-add">Adicionar à sacola</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ⚙️  CONFIGURAÇÃO — edite só esta parte
   ============================================================ */
const CONFIG = {
  // Número do WhatsApp (só números): 55 + DDD + número
  whatsapp: "5561900000000",

  // @ do Instagram (sem o @)
  instagram: "namidiamultimarcas",

  // Endereço no rodapé (com ícone de local). Deixe "" para ocultar.
  endereco: "",

  // Texto de apresentação da loja (aparece no rodapé). Deixe [] para ocultar.
  pitch: [
    "👕 Camisetas multimarcas e muito mais",
    "📦 Peça pelo catálogo, do P ao G1",
    "🚚 Enviamos para todo o Brasil 🇧🇷",
    "📲 Atendimento rápido e fácil pelo WhatsApp",
  ],

  // Chave PIX (opcional). Se preencher, ela vai junto na mensagem.
  pix: {
    chave: "",                         // ex.: "namidia@email.com" ou CPF/telefone
    titular: "Na Mídia Multimarcas",
  },
};

/* ============================================================
   🛍️  Os produtos vêm do Supabase (cadastrados no painel admin.html)
   A partir daqui é o funcionamento da loja (não precisa mexer)
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = n => Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lerLS = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch { return def; } };
const salvarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const waBase = "https://wa.me/" + CONFIG.whatsapp;

/* ---- contatos / rodapé ---- */
const oi = encodeURIComponent("Olá! Vim pela loja da Na Mídia Multimarcas e gostaria de mais informações ✨");
$("#header-wa").href = waBase + "?text=" + oi;
$("#float-wa").href  = waBase + "?text=" + oi;
$("#footer-ig").href = "https://instagram.com/" + CONFIG.instagram;
$("#ano").textContent = new Date().getFullYear();

if (CONFIG.pitch && CONFIG.pitch.length) $("#foot-pitch").textContent = CONFIG.pitch.join("\n");
else $("#foot-pitch").remove();

if (CONFIG.endereco) $("#foot-addr-text").textContent = CONFIG.endereco;
else $("#foot-addr").remove();

/* ---- estado ---- */
const grid = $("#grid");
const tabsEl = $("#tabs");
const loadMore = $("#load-more");
const sortSel = $("#sort");
const navDropdown = $("#nav-dropdown");
const navMenu = $("#nav-menu");
const overlay = $("#overlay");
const sheetWrap = $("#sheet-wrap");
const drawerCart = $("#drawer-cart");
const drawerFavs = $("#drawer-favs");
const drawerFilters = $("#drawer-filters");
const filtersDesktop = $("#filters-desktop");
const filtersMobile = $("#filters-mobile");

const PAGE = 12;
let PRODUTOS = [];
let visiveis = PAGE;

const filtros = {
  categorias: new Set(),
  tamanhos: new Set(),
  precoMin: null,
  precoMax: null,
  busca: "",
  ordenar: "recentes",
};

let cart = lerLS("nm_cart", []);
let favs = new Set(lerLS("nm_favs", []));

/* ---- carregar do supabase ---- */
async function carregarProdutos() {
  grid.innerHTML = `<p class="grid-msg">Carregando produtos…</p>`;
  const { data, error } = await supabaseClient
    .from("produtos")
    .select("*")
    .eq("ativo", true)
    .order("criado_em", { ascending: false });

  if (error) {
    grid.innerHTML = `<p class="grid-msg">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</p>`;
    console.error(error);
    return;
  }

  PRODUTOS = (data || []).map(p => {
    const preco = Number(p.preco);
    const precoDe = (p.preco_de != null && Number(p.preco_de) > preco) ? Number(p.preco_de) : null;
    return {
      id: String(p.id),
      nome: p.nome,
      categoria: p.categoria || "Geral",
      preco,
      precoDe,
      imagem: p.imagem_url || "",
      tamanhos: Array.isArray(p.tamanhos) ? p.tamanhos : [],
    };
  });

  montarTabs();
  montarFiltros();
  montarNavCategorias();
  render();
}

/* ---- filtro + ordenação ---- */
function categorias() {
  return [...new Set(PRODUTOS.map(p => p.categoria))].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

function listaFiltrada() {
  let l = PRODUTOS.slice();
  if (filtros.categorias.size) l = l.filter(p => filtros.categorias.has(p.categoria));
  if (filtros.tamanhos.size)   l = l.filter(p => p.tamanhos.some(t => filtros.tamanhos.has(t)));
  if (filtros.precoMin != null) l = l.filter(p => p.preco >= filtros.precoMin);
  if (filtros.precoMax != null) l = l.filter(p => p.preco <= filtros.precoMax);
  if (filtros.busca) {
    const q = filtros.busca.toLowerCase();
    l = l.filter(p => p.nome.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q));
  }
  if (filtros.ordenar === "menor") l.sort((a, b) => a.preco - b.preco);
  else if (filtros.ordenar === "maior") l.sort((a, b) => b.preco - a.preco);
  else if (filtros.ordenar === "az") l.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  return l;
}

function tabAtiva() {
  if (filtros.categorias.size === 0) return "Todos";
  if (filtros.categorias.size === 1) return [...filtros.categorias][0];
  return null;
}

/* ---- abas ---- */
function montarTabs() {
  tabsEl.innerHTML = "";
  [["Todos", "Todos"], ...categorias().map(c => [c, c])].forEach(([label, cat]) => {
    const b = document.createElement("button");
    b.className = "tab";
    b.dataset.cat = cat;
    b.textContent = label;
    b.onclick = () => {
      filtros.categorias.clear();
      if (cat !== "Todos") filtros.categorias.add(cat);
      visiveis = PAGE;
      render();
      $("#catalogo").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    tabsEl.appendChild(b);
  });
}

/* ---- menu "Categorias" da navbar ---- */
function montarNavCategorias() {
  navMenu.innerHTML = "";
  [["Ver tudo", "Todos"], ...categorias().map(c => [c, c])].forEach(([label, cat]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => {
      filtros.categorias.clear();
      if (cat !== "Todos") filtros.categorias.add(cat);
      visiveis = PAGE;
      navDropdown.classList.remove("open");
      render();
      $("#catalogo").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    navMenu.appendChild(b);
  });
}

/* ---- barra lateral de filtros (desktop + drawer mobile) ---- */
function montarFiltros() {
  const cats = categorias();
  const contar = c => PRODUTOS.filter(p => p.categoria === c).length;
  const catHTML = cats.map(c => `
    <label class="filter-opt">
      <input type="checkbox" data-cat="${esc(c)}">
      <span>${esc(c)}</span>
      <span class="qtd">(${contar(c)})</span>
    </label>`).join("");

  const ordem = ["PP", "P", "M", "G", "GG", "G1", "G2", "XG", "U"];
  const tamanhos = [...new Set(PRODUTOS.flatMap(p => p.tamanhos))].sort((a, b) => {
    const ia = ordem.indexOf(a), ib = ordem.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || String(a).localeCompare(String(b));
  });
  const tamHTML = tamanhos.map(t => `<button type="button" class="size-chip" data-size="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join("");

  const html = `
    <div class="filter-group">
      <h3>Categoria</h3>
      ${catHTML || '<p class="qtd">—</p>'}
    </div>
    <div class="filter-group">
      <h3>Faixa de preço</h3>
      <div class="price-range">
        <input type="number" inputmode="numeric" min="0" placeholder="Mín" class="f-min">
        <span>–</span>
        <input type="number" inputmode="numeric" min="0" placeholder="Máx" class="f-max">
      </div>
    </div>
    <div class="filter-group">
      <h3>Tamanho</h3>
      <div class="size-filter">${tamHTML || '<p class="qtd">—</p>'}</div>
    </div>
    <button class="btn-clear-filters" type="button">Limpar filtros</button>`;

  filtersDesktop.innerHTML = html;
  filtersMobile.innerHTML = html;
  [filtersDesktop, filtersMobile].forEach(ligarFiltros);
}

function ligarFiltros(box) {
  box.querySelectorAll("input[data-cat]").forEach(chk => {
    chk.onchange = () => {
      if (chk.checked) filtros.categorias.add(chk.dataset.cat);
      else filtros.categorias.delete(chk.dataset.cat);
      visiveis = PAGE;
      render();
    };
  });
  box.querySelectorAll(".size-chip").forEach(chip => {
    chip.onclick = () => {
      const s = chip.dataset.size;
      if (filtros.tamanhos.has(s)) filtros.tamanhos.delete(s);
      else filtros.tamanhos.add(s);
      visiveis = PAGE;
      render();
    };
  });
  const min = box.querySelector(".f-min"), max = box.querySelector(".f-max");
  const upd = debounce(() => {
    filtros.precoMin = min.value !== "" ? Number(min.value) : null;
    filtros.precoMax = max.value !== "" ? Number(max.value) : null;
    visiveis = PAGE;
    render();
  }, 350);
  min.oninput = upd;
  max.oninput = upd;
  box.querySelector(".btn-clear-filters").onclick = () => {
    filtros.categorias.clear();
    filtros.tamanhos.clear();
    filtros.precoMin = filtros.precoMax = null;
    filtros.busca = "";
    $$(".js-search").forEach(i => i.value = "");
    visiveis = PAGE;
    montarFiltros();
    render();
  };
}

/* ---- render da grade ---- */
function cardEl(p) {
  const el = document.createElement("article");
  el.className = "card";
  const desconto = p.precoDe ? Math.round((1 - p.preco / p.precoDe) * 100) : 0;
  el.innerHTML = `
    <div class="thumb ${p.imagem ? "" : "empty"}">
      ${desconto ? `<span class="badge-sale">-${desconto}%</span>` : ""}
      <button class="fav" data-fav="${p.id}" aria-pressed="${favs.has(p.id)}" aria-label="Favoritar">
        <svg viewBox="0 0 24 24"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 1 1 7.5-6.6 5 5 0 1 1 7.5 6.6"/></svg>
      </button>
      ${p.imagem
        ? `<img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy">`
        : `<span>+</span><span>Sem foto</span>`}
    </div>
    <div class="info">
      <span class="cat">${esc(p.categoria)}</span>
      <h3 class="title">${esc(p.nome)}</h3>
      <div class="price-row">
        <span class="price">${fmt(p.preco)}</span>
        ${p.precoDe ? `<span class="price-old">${fmt(p.precoDe)}</span>` : ""}
      </div>
      ${p.tamanhos.length ? `<span class="sizes-line">Tam.: ${p.tamanhos.map(esc).join(" · ")}</span>` : ""}
      <button class="btn-buy" data-buy="${p.id}">Comprar</button>
    </div>`;
  el.querySelector("[data-fav]").onclick = () => toggleFav(p.id);
  el.querySelector("[data-buy]").onclick = () => abrirSheet(p.id);
  return el;
}

function render() {
  const l = listaFiltrada();

  $("#count").textContent = l.length === 1 ? "1 produto" : `${l.length} produtos`;

  const ta = tabAtiva();
  $$(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === ta)));
  $$('input[data-cat]').forEach(c => c.checked = filtros.categorias.has(c.dataset.cat));
  $$(".size-chip").forEach(c => c.setAttribute("aria-pressed", String(filtros.tamanhos.has(c.dataset.size))));

  grid.innerHTML = "";
  if (!l.length) {
    grid.innerHTML = `<p class="grid-msg">Nenhum produto encontrado. Ajuste os filtros ✨</p>`;
    loadMore.hidden = true;
    return;
  }
  l.slice(0, visiveis).forEach(p => grid.appendChild(cardEl(p)));
  loadMore.hidden = visiveis >= l.length;
}

sortSel.onchange = () => { filtros.ordenar = sortSel.value; visiveis = PAGE; render(); };
loadMore.onclick = () => { visiveis += PAGE; render(); };

/* ---- busca ---- */
$$(".js-search").forEach(inp => {
  inp.oninput = debounce(() => {
    filtros.busca = inp.value.trim();
    $$(".js-search").forEach(o => { if (o !== inp) o.value = inp.value; });
    visiveis = PAGE;
    render();
  }, 250);
});

/* ---- navbar ---- */
$("#nav-cat-btn").onclick = e => {
  e.stopPropagation();
  const open = navDropdown.classList.toggle("open");
  $("#nav-cat-btn").setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", e => { if (!navDropdown.contains(e.target)) navDropdown.classList.remove("open"); });
$$('[data-nav]').forEach(a => {
  a.onclick = () => {
    if (a.dataset.nav === "produtos") { filtros.categorias.clear(); visiveis = PAGE; render(); }
  };
});
$("#btn-filter-mobile").onclick = () => abrirDrawer(drawerFilters);

/* ---- favoritos ---- */
function toggleFav(id) {
  id = String(id);
  if (favs.has(id)) favs.delete(id);
  else favs.add(id);
  salvarLS("nm_favs", [...favs]);
  atualizarBadges();
  render();
  if (drawerFavs.classList.contains("open")) renderFavoritos();
}

function renderFavoritos() {
  const items = PRODUTOS.filter(p => favs.has(p.id));
  const body = $("#favs-body");
  if (!items.length) {
    body.innerHTML = `<div class="drawer-empty">Você ainda não favoritou nenhum produto.</div>`;
    return;
  }
  body.innerHTML = `<div class="favs-grid">` + items.map(p => `
    <div class="fav-card">
      <div class="thumb">${p.imagem ? `<img src="${esc(p.imagem)}" alt="${esc(p.nome)}">` : ""}</div>
      <div class="title">${esc(p.nome)}</div>
      <div class="price">${fmt(p.preco)}</div>
      <div class="mini-actions">
        <button class="add" data-add="${p.id}">Comprar</button>
        <button class="rm" data-rm="${p.id}">Remover</button>
      </div>
    </div>`).join("") + `</div>`;
  body.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { fecharDrawers(); abrirSheet(b.dataset.add); });
  body.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => toggleFav(b.dataset.rm));
}

/* ---- folha "adicionar à sacola" ---- */
let sheetProd = null, sheetSize = null, sheetQty = 1;

function abrirSheet(id) {
  sheetProd = PRODUTOS.find(p => p.id === String(id));
  if (!sheetProd) return;
  sheetSize = null;
  sheetQty = 1;

  $("#s-cat").textContent = sheetProd.categoria;
  $("#s-name").textContent = sheetProd.nome;
  $("#s-price").innerHTML = fmt(sheetProd.preco) +
    (sheetProd.precoDe ? `<span class="old">${fmt(sheetProd.precoDe)}</span>` : "");
  $("#s-qty").textContent = "1";
  $("#s-err").classList.remove("show");

  const sr = $("#s-sizes");
  if (sheetProd.tamanhos.length) {
    $("#s-size-block").style.display = "";
    sr.innerHTML = "";
    sheetProd.tamanhos.forEach(t => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "size-opt";
      b.textContent = t;
      b.onclick = () => {
        sheetSize = t;
        sr.querySelectorAll(".size-opt").forEach(o => o.classList.toggle("sel", o === b));
        $("#s-err").classList.remove("show");
      };
      sr.appendChild(b);
    });
  } else {
    $("#s-size-block").style.display = "none";
  }

  sheetWrap.classList.add("open");
  lockScroll(true);
}

$("#s-qminus").onclick = () => { sheetQty = Math.max(1, sheetQty - 1); $("#s-qty").textContent = sheetQty; };
$("#s-qplus").onclick  = () => { sheetQty++; $("#s-qty").textContent = sheetQty; };

$("#s-add").onclick = () => {
  if (sheetProd.tamanhos.length && !sheetSize) { $("#s-err").classList.add("show"); return; }
  addAoCarrinho(sheetProd, sheetSize, sheetQty);
  sheetWrap.classList.remove("open");
  toast("Adicionado à sacola");
  renderCarrinho();
  abrirDrawer(drawerCart);
};

$("#s-close").onclick = () => { sheetWrap.classList.remove("open"); lockScroll(false); };
sheetWrap.onclick = e => { if (e.target === sheetWrap) { sheetWrap.classList.remove("open"); lockScroll(false); } };

/* ---- sacola ---- */
function addAoCarrinho(p, size, qty) {
  const key = p.id + "|" + (size || "");
  const found = cart.find(i => (i.id + "|" + (i.size || "")) === key);
  if (found) found.qty += qty;
  else cart.push({ id: p.id, nome: p.nome, preco: p.preco, size: size || "", imagem: p.imagem, qty });
  persistCart();
}

function persistCart() { salvarLS("nm_cart", cart); atualizarBadges(); }
function totalCarrinho() { return cart.reduce((s, i) => s + i.preco * i.qty, 0); }

function renderCarrinho() {
  const body = $("#cart-body"), foot = $("#cart-foot");
  if (!cart.length) {
    body.innerHTML = `<div class="drawer-empty">Sua sacola está vazia.</div>`;
    foot.style.display = "none";
    return;
  }
  foot.style.display = "";
  body.innerHTML = cart.map((i, idx) => `
    <div class="cart-item">
      ${i.imagem ? `<img src="${esc(i.imagem)}" alt="">` : `<div class="ci-thumb-empty">+</div>`}
      <div>
        <div class="ci-name">${esc(i.nome)}</div>
        <div class="ci-meta">${i.size ? "Tam. " + esc(i.size) : "Tamanho único"}</div>
        <div class="qty">
          <button data-dec="${idx}" aria-label="Diminuir">−</button>
          <span>${i.qty}</span>
          <button data-inc="${idx}" aria-label="Aumentar">+</button>
        </div>
      </div>
      <div class="ci-right">
        <button class="ci-remove" data-del="${idx}">remover</button>
        <div class="ci-price">${fmt(i.preco * i.qty)}</div>
      </div>
    </div>`).join("");
  $("#cart-total-val").textContent = fmt(totalCarrinho());

  body.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { cart[+b.dataset.inc].qty++; persistCart(); renderCarrinho(); });
  body.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const i = cart[+b.dataset.dec]; i.qty = Math.max(1, i.qty - 1); persistCart(); renderCarrinho(); });
  body.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { cart.splice(+b.dataset.del, 1); persistCart(); renderCarrinho(); });
}

$("#cart-checkout").onclick = () => {
  const nome = $("#cart-nome").value.trim();
  const obs  = $("#cart-obs").value.trim();
  const err  = $("#cart-err");
  if (!cart.length) return;
  if (!nome) { err.textContent = "Preencha seu nome para continuar."; err.classList.add("show"); return; }
  err.classList.remove("show");

  let msg = "Olá! Quero fazer um pedido na *Na Mídia Multimarcas* 🛍️\n\n";
  cart.forEach((i, n) => {
    msg += `${n + 1}. *${i.nome}*\n`;
    if (i.size) msg += `   Tam.: ${i.size}\n`;
    msg += `   Qtd.: ${i.qty}  ·  ${fmt(i.preco * i.qty)}\n`;
  });
  msg += `\n💰 *Total: ${fmt(totalCarrinho())}*\n\n👤 *Nome:* ${nome}`;
  if (obs) msg += `\n📝 *Observação:* ${obs}`;
  if (CONFIG.pix.chave) {
    msg += `\n\n💳 *PIX para pagamento*\nChave: ${CONFIG.pix.chave}\nTitular: ${CONFIG.pix.titular}\n\nAssim que enviar o comprovante, despachamos seu pedido 💛`;
  } else {
    msg += `\n\nPode me enviar a chave PIX para concluir o pagamento? 💛`;
  }
  window.open(waBase + "?text=" + encodeURIComponent(msg), "_blank");
};

/* ---- badges + overlays ---- */
function atualizarBadges() {
  const fb = $("#fav-count"), cb = $("#cart-count");
  fb.textContent = favs.size;
  fb.classList.toggle("show", favs.size > 0);
  const n = cart.reduce((s, i) => s + i.qty, 0);
  cb.textContent = n;
  cb.classList.toggle("show", n > 0);
}

function lockScroll(on) { document.body.style.overflow = on ? "hidden" : ""; }

function abrirDrawer(d) {
  overlay.classList.add("open");
  d.classList.add("open");
  lockScroll(true);
}
function fecharDrawers() {
  overlay.classList.remove("open");
  $$(".drawer").forEach(d => d.classList.remove("open"));
  if (!sheetWrap.classList.contains("open")) lockScroll(false);
}

$("#btn-favs").onclick = () => { renderFavoritos(); abrirDrawer(drawerFavs); };
$("#btn-cart").onclick = () => { renderCarrinho(); abrirDrawer(drawerCart); };
overlay.onclick = fecharDrawers;
$$('[data-close-drawer]').forEach(b => b.onclick = fecharDrawers);

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (sheetWrap.classList.contains("open")) { sheetWrap.classList.remove("open"); lockScroll(false); }
  else fecharDrawers();
});

/* ---- toast ---- */
let toastT;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---- start ---- */
atualizarBadges();
carregarProdutos();
</script>
</body>
</html>
